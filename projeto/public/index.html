<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Assinatura - NerdResolve</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" type="image/x-icon" href="./assets/favicon.png">

  <style>
    :root {
      --color-primary:    #629676;
      --color-primary-dk: #4a7560;
      --color-primary-lt: #94aca1;
      --color-bg:         #96aa9e;
    }

    body { font-family: 'Open Sans', sans-serif; }

    .gradient-bg {
      background: linear-gradient(135deg, var(--color-bg) 0%, var(--color-primary-lt) 100%);
    }

    /* Botao principal */
    .btn-primary {
      background: linear-gradient(135deg, var(--color-primary) 0%, #6F9685 100%);
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .btn-primary:hover  { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15); }
    .btn-primary:active { transform: translateY(0);    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }

    /* Indicador de etapas */
    .step-circle {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 14px;
      transition: all 0.3s ease;
    }
    .step-active   { background: var(--color-primary);    color: #fff; }
    .step-done     { background: var(--color-primary-dk); color: #fff; }
    .step-inactive { background: #e5e7eb; color: #9ca3af; }

    .step-connector      { flex: 1; height: 2px; background: #e5e7eb; margin: 0 8px; transition: background 0.3s; }
    .step-connector-done { background: var(--color-primary); }

    /* Cards de segmento */
    .segment-card {
      border: 2px solid #e5e7eb;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.25s ease;
      overflow: hidden;
      background: #fff;
    }
    .segment-card:hover {
      border-color: var(--color-primary);
      box-shadow: 0 4px 16px rgba(98, 150, 118, 0.2);
      transform: translateY(-2px);
    }
    .segment-card.selected {
      border-color: var(--color-primary);
      box-shadow: 0 4px 20px rgba(98, 150, 118, 0.35);
      background: #f0f7f3;
    }
    .segment-card.selected .segment-checkmark { opacity: 1; }
    .segment-checkmark { opacity: 0; transition: opacity 0.2s; }

    .segment-preview {
      width: 100%; height: 90px;
      object-fit: cover; object-position: left top;
      border-bottom: 1px solid #f0f0f0;
      background: #f9fafb;
    }

    /* Campos de formulario */
    .form-input {
      width: 100%; padding: 10px 14px;
      border: 1px solid #d1d5db; border-radius: 8px;
      font-size: 14px; color: #374151;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(98, 150, 118, 0.15);
    }
    .form-label {
      font-size: 12px; font-weight: 600; color: #6b7280;
      margin-bottom: 4px; display: block;
    }

    /* Dropdown customizado */
    .dropdown-wrapper { position: relative; }

    .dropdown-trigger {
      background: #fff; border: 1px solid #d1d5db; border-radius: 8px;
      padding: 10px 36px 10px 14px; cursor: pointer; user-select: none;
      font-size: 14px; color: #374151; position: relative;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .dropdown-trigger.is-placeholder { color: #9ca3af; }
    .dropdown-trigger:hover           { border-color: var(--color-primary); }
    .dropdown-trigger.is-open {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(98, 150, 118, 0.15);
    }

    .dropdown-arrow {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%) rotate(0deg);
      transition: transform 0.2s;
      color: #9ca3af; font-size: 12px;
    }
    .dropdown-trigger.is-open .dropdown-arrow { transform: translateY(-50%) rotate(180deg); }

    .dropdown-list {
      position: absolute; background: #fff; top: calc(100% + 4px);
      left: 0; right: 0; z-index: 100;
      border: 1px solid #d1d5db; border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      max-height: 220px; overflow-y: auto;
      opacity: 0; visibility: hidden; transform: translateY(-8px);
      transition: all 0.2s ease;
    }
    .dropdown-list.is-visible { opacity: 1; visibility: visible; transform: translateY(0); }

    .dropdown-group-label {
      padding: 8px 14px 4px; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: #9ca3af; pointer-events: none;
    }
    .dropdown-option {
      padding: 9px 14px; font-size: 13px; cursor: pointer;
      color: #374151; transition: background 0.15s;
    }
    .dropdown-option:hover    { background: #f0f7f3; color: var(--color-primary); }
    .dropdown-option.selected { background: var(--color-primary); color: #fff; }

    /* Animacoes de transicao entre etapas */
    .slide-enter { animation: slideIn  0.35s ease forwards; }
    .slide-leave { animation: slideOut 0.25s ease forwards; }

    @keyframes slideIn  { from { opacity: 0; transform: translateX(30px);  } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(-30px); } }

    /* Overlay de carregamento */
    #loading-overlay {
      position: fixed; inset: 0; background: rgba(255, 255, 255, 0.85);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    #loading-overlay.is-visible { opacity: 1; pointer-events: all; }

    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #e5e7eb; border-top-color: var(--color-primary);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 767px) {
      .mobile-banner { height: 130px; object-position: center; }
    }
  </style>
</head>

<body class="gradient-bg min-h-screen flex items-center justify-center p-4">

  <div id="loading-overlay">
    <div class="spinner mb-4"></div>
    <p class="text-gray-600 font-medium">Gerando sua assinatura...</p>
  </div>

  <div class="w-full max-w-5xl bg-white rounded-3xl shadow-xl overflow-hidden">

    <div class="md:hidden w-full">
      <img src="/assets/banner2.jpg" alt="NerdResolve" class="w-full h-full object-cover mobile-banner">
    </div>

    <div class="flex flex-col md:flex-row min-h-[520px]">

      <div class="w-full md:w-[55%] p-6 md:p-10 flex flex-col">

        <div class="text-center mb-6">
          <img src="/assets/GrupoNerdResolveLogo.png" alt="Logo NerdResolve" class="mx-auto h-10 md:h-14">
          <h1 class="text-xl font-semibold text-gray-600 mt-3">Gerador de Assinaturas</h1>
        </div>

        <div class="flex items-center mb-8 px-2">
          <div class="step-circle step-active" id="step-circle-1">1</div>
          <div class="step-connector" id="step-connector-1"></div>
          <div class="step-circle step-inactive" id="step-circle-2">2</div>
        </div>

        <!-- Etapa 1: selecao de segmento -->
        <div id="step-1" class="flex-1 flex flex-col slide-enter">
          <p class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-4">Selecione seu segmento</p>

          <div class="grid grid-cols-2 gap-3 flex-1">

            <div class="segment-card" data-segment="corporativo">
              <img src="/assets/Corporativo.PNG" class="segment-preview" alt="Corporativo">
              <div class="p-3 flex items-center justify-between">
                <div>
                  <p class="font-semibold text-gray-700 text-sm">Corporativo</p>
                  <p class="text-xs text-gray-400">NerdResolve</p>
                </div>
                <i class="fas fa-check-circle text-green-600 segment-checkmark text-lg"></i>
              </div>
            </div>

            <div class="segment-card" data-segment="offshore">
              <img src="/assets/Offshore.PNG" class="segment-preview" alt="Offshore">
              <div class="p-3 flex items-center justify-between">
                <div>
                  <p class="font-semibold text-gray-700 text-sm">Offshore</p>
                  <p class="text-xs text-gray-400">NerdResolve</p>
                </div>
                <i class="fas fa-check-circle text-green-600 segment-checkmark text-lg"></i>
              </div>
            </div>

            <div class="segment-card" data-segment="Operacoes">
              <img src="/assets/Operacoes.PNG" class="segment-preview" alt="Operacoes">
              <div class="p-3 flex items-center justify-between">
                <div>
                  <p class="font-semibold text-gray-700 text-sm">Operacoes</p>
                  <p class="text-xs text-gray-400">NerdResolve</p>
                </div>
                <i class="fas fa-check-circle text-green-600 segment-checkmark text-lg"></i>
              </div>
            </div>

            <div class="segment-card" data-segment="estaleiro">
              <img src="/assets/Estaleiro.PNG" class="segment-preview" alt="Estaleiro">
              <div class="p-3 flex items-center justify-between">
                <div>
                  <p class="font-semibold text-gray-700 text-sm">Estaleiro</p>
                  <p class="text-xs text-gray-400">NerdResolve</p>
                </div>
                <i class="fas fa-check-circle text-green-600 segment-checkmark text-lg"></i>
              </div>
            </div>

            <div class="segment-card" data-segment="Servicos">
              <img src="/assets/Servicos.PNG" class="segment-preview" alt="Servicos">
              <div class="p-3 flex items-center justify-between">
                <div>
                  <p class="font-semibold text-gray-700 text-sm">Servicos</p>
                  <p class="text-xs text-gray-400">NerdResolve</p>
                </div>
                <i class="fas fa-check-circle text-green-600 segment-checkmark text-lg"></i>
              </div>
            </div>

          </div>

          <div class="mt-6 text-center">
            <button id="btn-next" class="btn-primary text-white px-10 py-3 rounded-full font-semibold disabled:opacity-40" disabled>
              Próximo <i class="fas fa-arrow-right ml-2"></i>
            </button>
          </div>
        </div>

        <!-- Etapa 2: formulario -->
        <div id="step-2" class="hidden flex-1 flex flex-col">

          <button id="btn-back" class="text-sm text-gray-400 hover:text-gray-600 flex items-center mb-5 w-fit transition-colors">
            <i class="fas fa-arrow-left mr-2"></i> Voltar
          </button>

          <div class="space-y-4 flex-1">

            <div>
              <label class="form-label">Nome completo <span class="text-red-400">*</span></label>
              <input id="field-name" class="form-input" type="text" placeholder="Ex: João da Silva" maxlength="50">
            </div>

            <div>
              <label class="form-label">Setor <span class="text-red-400">*</span></label>
              <div class="dropdown-wrapper" id="sector-dropdown">
                <div class="dropdown-trigger is-placeholder" id="dropdown-trigger">
                  Selecione seu setor
                  <span class="dropdown-arrow"><i class="fas fa-chevron-down"></i></span>
                </div>
                <div class="dropdown-list" id="dropdown-list"></div>
              </div>
              <input type="hidden" id="field-sector">
            </div>

            <div>
              <label class="form-label">E-mail corporativo <span class="text-red-400">*</span></label>
              <input id="field-email" class="form-input" type="email" placeholder="nome@NerdResolve.com.br">
            </div>

            <div>
              <label class="form-label">Telefone <span class="text-gray-300 font-normal">(opcional)</span></label>
              <input id="field-phone" class="form-input" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="+55 (21) 99999-9999">
              <p class="text-xs text-gray-400 mt-2">Digite com DDD. A assinatura sempre será gerada com +55 na frente.</p>
            </div>

          </div>

          <div class="mt-6 text-center">
            <button id="btn-generate" class="btn-primary text-white px-10 py-3 rounded-full font-semibold">
              <i class="fas fa-download mr-2"></i> Gerar Assinatura
            </button>
          </div>
        </div>

      </div>

      <div class="hidden md:flex md:w-[45%] bg-gray-50 relative overflow-hidden flex-col">
        <img src="/assets/banner2.jpg" alt="NerdResolve" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
      </div>

    </div>
  </div>

  <script>
    const SECTOR_OPTIONS = {
      'CORPORATIVO': [
        'Diretor', 'Gerente', 'Coordenador', 'Supervisor',
        'Comunicação & Marketing', 'Recursos Humanos', 'Fiscal', 'Célula Fiscal',
        'Gestão de Materiais', 'Gestão de Fornecedores', 'Comércio Exterior', 'Suprimentos',
        'Tesouraria', 'Contas a pagar', 'Contas a receber', 'Controladoria', 'Contabilidade',
        'Financeiro', 'Comercial', 'Gestão Econômica de Contratos', 'Jurídico', 'QSMS',
        'Administrativo', 'Saúde Ocupacional', 'Tecnologia da Informação',
        'Treinamentos Obrigatórios', 'Logística de Tripulação', 'Projetos',
      ],
      'Servicos': [
        'Diretor', 'Gerente', 'Coordenador', 'Supervisor',
        'Operação Ambiental', 'Manutenção Ambiental', 'Administrativo Ambiental',
        'QSMS Ambiental', 'Comercial Ambiental', 'Área Técnica Ambiental', 'Logística Ambiental',
      ],
      'OFFSHORE': [
        'Diretor', 'Gerente', 'Coordenador', 'Supervisor',
        'Operação Offshore', 'Manutenção Offshore', 'Administrativo Offshore',
        'QSMS Offshore', 'Comercial Offshore', 'Docagem', 'DP',
      ],
      'Operacoes': [
        'Diretor', 'Gerente', 'Coordenador', 'Supervisor',
        'Operação', 'Manutenção', 'Administrativo', 'QSMS', 'Comercial',
        'Financeiro', 'Recursos Humanos', 'Tecnologia da Informação',
      ],
      'ESTALEIRO': [
        'Diretor', 'Gerente', 'Coordenador', 'Supervisor',
        'Comercial Estaleiro', 'Manutenção Estaleiro', 'PCP', 'Produção', 'Engenharia',
        'Administrativo Estaleiro', 'QSMS Estaleiro',
      ],
    };

    const NAME_PATTERN  = /^[\p{L}\p{M}\s'-]+$/u;
    const SLIDE_OUT_MS  = 250;
    const SLIDE_IN_MS   = 400;

    let selectedSegment = null;

    // -- Elementos do DOM --
    const stepPanel1       = document.getElementById('step-1');
    const stepPanel2       = document.getElementById('step-2');
    const stepCircle1      = document.getElementById('step-circle-1');
    const stepCircle2      = document.getElementById('step-circle-2');
    const stepConnector1   = document.getElementById('step-connector-1');
    const btnNext          = document.getElementById('btn-next');
    const btnBack          = document.getElementById('btn-back');
    const btnGenerate      = document.getElementById('btn-generate');
    const loadingOverlay   = document.getElementById('loading-overlay');
    const fieldName        = document.getElementById('field-name');
    const fieldSector      = document.getElementById('field-sector');
    const fieldEmail       = document.getElementById('field-email');
    const fieldPhone       = document.getElementById('field-phone');
    const dropdownTrigger  = document.getElementById('dropdown-trigger');
    const dropdownList     = document.getElementById('dropdown-list');
    const sectorDropdown   = document.getElementById('sector-dropdown');

    // -- Dropdown de setor --
    const buildSectorDropdown = () => {
      dropdownList.innerHTML = '';

      for (const [groupLabel, options] of Object.entries(SECTOR_OPTIONS)) {
        const groupHeader = document.createElement('div');
        groupHeader.className = 'dropdown-group-label';
        groupHeader.textContent = groupLabel;
        dropdownList.appendChild(groupHeader);

        for (const optionLabel of options) {
          const optionEl = document.createElement('div');
          optionEl.className = 'dropdown-option';
          optionEl.textContent = optionLabel;
          optionEl.addEventListener('click', () => selectSector(optionLabel, optionEl));
          dropdownList.appendChild(optionEl);
        }
      }
    };

    const openDropdown = () => {
      dropdownList.classList.add('is-visible');
      dropdownTrigger.classList.add('is-open');
    };

    const closeDropdown = () => {
      dropdownList.classList.remove('is-visible');
      dropdownTrigger.classList.remove('is-open');
    };

    const toggleDropdown = () => {
      dropdownList.classList.contains('is-visible') ? closeDropdown() : openDropdown();
    };

    const selectSector = (label, selectedOptionEl) => {
      fieldSector.value = label;

      dropdownTrigger.textContent = label;
      dropdownTrigger.classList.remove('is-placeholder');

      const arrowIcon = document.createElement('span');
      arrowIcon.className = 'dropdown-arrow';
      arrowIcon.innerHTML = '<i class="fas fa-chevron-down"></i>';
      dropdownTrigger.appendChild(arrowIcon);

      dropdownList.querySelectorAll('.dropdown-option').forEach(opt => opt.classList.remove('selected'));
      selectedOptionEl.classList.add('selected');

      closeDropdown();
    };

    dropdownTrigger.addEventListener('click', toggleDropdown);

    document.addEventListener('click', (event) => {
      if (!sectorDropdown.contains(event.target)) closeDropdown();
    });

    // -- Selecao de segmento --
    const selectSegment = (clickedCard) => {
      document.querySelectorAll('.segment-card').forEach(card => card.classList.remove('selected'));
      clickedCard.classList.add('selected');
      selectedSegment = clickedCard.dataset.segment;
      btnNext.disabled = false;
    };

    document.querySelectorAll('.segment-card').forEach(card => {
      card.addEventListener('click', () => selectSegment(card));
    });

    // -- Navegacao entre etapas --
    const advanceToStep2 = () => {
      if (!selectedSegment) return;

      stepPanel1.classList.add('slide-leave');
      setTimeout(() => {
        stepPanel1.classList.add('hidden');
        stepPanel1.classList.remove('slide-leave');
        stepPanel2.classList.remove('hidden');
        stepPanel2.classList.add('slide-enter');
        setTimeout(() => stepPanel2.classList.remove('slide-enter'), SLIDE_IN_MS);
      }, SLIDE_OUT_MS);

      stepCircle1.className = 'step-circle step-done';
      stepCircle1.innerHTML = '<i class="fas fa-check text-xs"></i>';
      stepConnector1.classList.add('step-connector-done');
      stepCircle2.className = 'step-circle step-active';
    };

    const returnToStep1 = () => {
      stepPanel2.classList.add('hidden');
      stepPanel1.classList.remove('hidden');
      stepPanel1.classList.add('slide-enter');
      setTimeout(() => stepPanel1.classList.remove('slide-enter'), SLIDE_IN_MS);

      stepCircle1.className = 'step-circle step-active';
      stepCircle1.textContent = '1';
      stepConnector1.classList.remove('step-connector-done');
      stepCircle2.className = 'step-circle step-inactive';
    };

    btnNext.addEventListener('click', advanceToStep2);
    btnBack.addEventListener('click', returnToStep1);

    // -- Formulario --
    const normalizeText = (value) => value.normalize('NFC').trim();

    const formatPhoneNumber = (rawValue) => {
      const digitsOnly = rawValue.replace(/\D/g, '');
      const localDigits = digitsOnly.startsWith('55') ? digitsOnly.slice(2) : digitsOnly;

      if (!localDigits) return '';
      if (localDigits.length < 10 || localDigits.length > 11) return null;

      const areaCode = localDigits.slice(0, 2);
      const number   = localDigits.slice(2);
      const splitAt  = number.length === 9 ? 5 : 4;

      return `+55 (${areaCode}) ${number.slice(0, splitAt)}-${number.slice(splitAt)}`;
    };

    const applyPhoneMask = (event) => {
      const digitsOnly   = event.target.value.replace(/\D/g, '');
      const localDigits  = digitsOnly.startsWith('55') ? digitsOnly.slice(2) : digitsOnly;
      const cappedDigits = localDigits.slice(0, 11);

      if (!cappedDigits) { event.target.value = ''; return; }
      if (cappedDigits.length <= 2) { event.target.value = `(${cappedDigits}`; return; }

      const areaCode = cappedDigits.slice(0, 2);
      const number   = cappedDigits.slice(2);

      if (number.length <= 4) { event.target.value = `(${areaCode}) ${number}`; return; }

      const splitAt = number.length > 8 ? 5 : 4;
      const prefix  = number.slice(0, splitAt);
      const suffix  = number.slice(splitAt);

      event.target.value = suffix
        ? `(${areaCode}) ${prefix}-${suffix}`
        : `(${areaCode}) ${prefix}`;
    };

    const validateForm = () => {
      const name   = normalizeText(fieldName.value);
      const sector = normalizeText(fieldSector.value);
      const email  = fieldEmail.value.trim();
      const phone  = fieldPhone.value.trim();

      if (!name || !sector || !email) {
        alert('Preencha todos os campos obrigatórios.');
        return false;
      }
      if (name.length > 50) {
        alert('O nome deve ter até 50 caracteres.');
        return false;
      }
      if (!NAME_PATTERN.test(name)) {
        alert('O nome contém caracteres inválidos.');
        return false;
      }
      if (!email.includes('@')) {
        alert('E-mail inválido.');
        return false;
      }
      if (phone && !formatPhoneNumber(phone)) {
        alert('Formato de telefone inválido.\nEx: +55 (21) 99999-9999');
        return false;
      }

      return true;
    };

    const downloadBlob = (blob, filename) => {
      const downloadLink = document.createElement('a');
      downloadLink.href = URL.createObjectURL(blob);
      downloadLink.download = filename;
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
    };

    const submitSignatureRequest = async () => {
      if (!validateForm()) return;

      loadingOverlay.classList.add('is-visible');

      const payload = {
        signSegment: selectedSegment,
        signName:    normalizeText(fieldName.value),
        signSector:  normalizeText(fieldSector.value),
        signEmail:   fieldEmail.value.trim(),
        signPhone:   formatPhoneNumber(fieldPhone.value.trim()) || '',
      };

      try {
        const response = await fetch('/signaturegenerator', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          alert('Erro: ' + await response.text());
          return;
        }

        downloadBlob(await response.blob(), 'assinatura_NerdResolve.png');

      } catch {
        alert('Erro na solicitação. Tente novamente.');
      } finally {
        loadingOverlay.classList.remove('is-visible');
      }
    };

    btnGenerate.addEventListener('click', submitSignatureRequest);

    // -- Navegacao por teclado --
    const setupKeyboardNavigation = () => {
      const focusableFields = [fieldName, fieldEmail, fieldPhone];

      focusableFields.forEach((field, index) => {
        field.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter') return;
          event.preventDefault();

          const isLastField = index === focusableFields.length - 1;
          if (isLastField) submitSignatureRequest();
          else focusableFields[index + 1].focus();
        });
      });
    };

    // -- Inicializacao --
    document.addEventListener('DOMContentLoaded', () => {
      buildSectorDropdown();
      setupKeyboardNavigation();
      fieldPhone.addEventListener('input', applyPhoneMask);
    });
  </script>

</body>
</html>
